<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Vendas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Sistema de Gestão de Vendas</h1>
    <p>Painel simplificado para pequenos comerciantes</p>
  </header>

  <main class="container">
    <!-- Seção 1: Catálogo de Produtos -->
    <section class="card">
      <h2>Catálogo de Produtos</h2>
      <div id="catalogo-produtos" class="grid-produtos"></div>
    </section>

    <!-- Seção 2: Calculadora de Desconto -->
    <section class="card">
      <h2>Calculadora de Desconto</h2>
      <div class="form-group">
        <label for="valor-venda">Valor da Venda (R$):</label>
        <input type="number" id="valor-venda" placeholder="Ex: 100.00" step="0.01">
      </div>
      <div class="form-group">
        <label for="porcentagem-desconto">Desconto (%):</label>
        <input type="number" id="porcentagem-desconto" placeholder="Ex: 10">
      </div>
      <button onclick="calcularDesconto()">Calcular Valor Final</button>
      <div id="resultado-desconto" class="resultado"></div>
    </section>

    <!-- Seção 3: Consulta de CEP -->
    <section class="card">
      <h2>Consulta de Endereço de Entrega (API ViaCEP)</h2>
      <div class="form-group">
        <label for="cep">CEP:</label>
        <input type="text" id="cep" placeholder="00000-000" maxlength="8">
      </div>
      <button onclick="buscarCEP()">Buscar Endereço</button>
      
      <div id="dados-endereco" class="resultado-endereco">
        <p><strong>Logradouro:</strong> <span id="logradouro">-</span></p>
        <p><strong>Bairro:</strong> <span id="bairro">-</span></p>
        <p><strong>Cidade/UF:</strong> <span id="cidade-uf">-</span></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
